<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Glossy Body Gradient -->
    <linearGradient id="sparkBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1927" />
      <stop offset="25%" stop-color="#120B1A" />
      <stop offset="70%" stop-color="#08040D" />
      <stop offset="100%" stop-color="#020104" />
    </linearGradient>

    <!-- Outer Silver Glass Rim -->
    <linearGradient id="sparkGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#E08AFF" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#521D66" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.65" />
    </linearGradient>

    <!-- Ambient Center Magenta Glow -->
    <radialGradient id="sparkCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F018FF" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#9C00B8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Vibrant Magenta Starburst Gradient -->
    <linearGradient id="sparkStarGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFA6FF" />
      <stop offset="30%" stop-color="#F018FF" />
      <stop offset="65%" stop-color="#B300C4" />
      <stop offset="100%" stop-color="#6C0078" />
    </linearGradient>

    <!-- Starburst Specular Highlight -->
    <linearGradient id="sparkStarHighlight" x1="25%" y1="15%" x2="75%" y2="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFC2FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F018FF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Outer Star Glow -->
    <filter id="sparkStarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Maskable Safe Area Full Bleed Background -->
  <rect width="512" height="512" fill="url(#sparkBgGrad)" />

  <!-- Ambient Radial Magenta Core Glow -->
  <rect width="512" height="512" fill="url(#sparkCenterGlow)" />

  <!-- Starburst and Accent Flares Scaled for Safe Zone -->
  <g transform="translate(256, 256) scale(4.2) translate(-50, -50)">
    <!-- Glow Aura -->
    <path
      d="M 71 19 C 61 31, 54 43, 58 48 C 65 52, 73 53, 73 53 C 62 55, 53 52, 48 57 C 42 66, 33 77, 33 77 C 40 64, 46 54, 42 48 C 34 47, 30 49, 30 49 C 41 47, 46 48, 71 19 Z"
      fill="#F018FF"
      filter="url(#sparkStarGlow)"
      opacity="0.8"
    />

    <!-- 3D Main Star Burst Body -->
    <path
      d="M 71 19 C 61 31, 54 43, 58 48 C 65 52, 73 53, 73 53 C 62 55, 53 52, 48 57 C 42 66, 33 77, 33 77 C 40 64, 46 54, 42 48 C 34 47, 30 49, 30 49 C 41 47, 46 48, 71 19 Z"
      fill="url(#sparkStarGrad)"
    />

    <!-- Top Ridge Specular Gloss -->
    <path
      d="M 71 19 C 61 31, 54 43, 58 48 C 63 50, 68 52, 73 53 C 62 53, 53 51, 48 57 C 45 62, 40 70, 37 74 C 40 64, 46 54, 42 48 C 36 47, 30 49, 30 49 C 41 47, 46 48, 71 19 Z"
      fill="url(#sparkStarHighlight)"
    />

    <!-- 3 Accent Flares -->
    <g>
      <polygon points="41,30 47,40 43,37" fill="url(#sparkStarGrad)" />
      <polygon points="41,30 45,37 43,37" fill="#FFFFFF" opacity="0.75" />

      <polygon points="53,60 57,69 53,62" fill="url(#sparkStarGrad)" />
      <polygon points="53,60 55,66 53,62" fill="#FFFFFF" opacity="0.75" />

      <polygon points="63,48 72,46 64,50" fill="url(#sparkStarGrad)" />
      <polygon points="63,48 68,47 64,50" fill="#FFFFFF" opacity="0.75" />
    </g>
  </g>
</svg>
